openapi: 3.0.3
info:
  title: My API
  version: 1.0.0
paths:
  /auth/login:
    post:
      x-handler: handlers/auth#login
      x-inputParser: handlers/auth#parseLoginInput
      summary: Log in and receive a JWT
      responses:
        '200':
          description: Success
        '400':
          description: Missing email or password
        '401':
          description: Invalid email or password

  /vacation-requests:
    post:
      x-handler: handlers/vacationRequests#submitRequest
      x-inputParser: handlers/vacationRequests#parseSubmitRequest
      summary: Submit a vacation request (requester only)
      responses:
        '201':
          description: Created
        '400':
          description: Invalid input or date order/past-date rule violation
        '401':
          description: Missing or invalid token
        '403':
          description: Authenticated but not a requester
        '409':
          description: Overlaps an existing request
    get:
      x-handler: handlers/vacationRequests#listVacationRequests
      x-inputParser: handlers/vacationRequests#parseValidatorListRequest
      summary: List all vacation requests, with optional status/userId filters (validator only)
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Success
        '401':
          description: Missing or invalid token
        '403':
          description: Authenticated but not a validator

  /vacation-requests/:id/approve:
    patch:
      x-handler: handlers/vacationRequests#approveRequest
      x-inputParser: handlers/vacationRequests#parseApproveRequest
      summary: Approve a pending vacation request (validator only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
        '401':
          description: Missing or invalid token
        '403':
          description: Authenticated but not a validator
        '404':
          description: Request not found
        '409':
          description: Request is not pending

  /vacation-requests/:id/reject:
    patch:
      x-handler: handlers/vacationRequests#rejectRequest
      x-inputParser: handlers/vacationRequests#parseRejectRequest
      summary: Reject a pending vacation request with a required comment (validator only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
        '400':
          description: Missing or blank comment
        '401':
          description: Missing or invalid token
        '403':
          description: Authenticated but not a validator
        '404':
          description: Request not found
        '409':
          description: Request is not pending

  /users:
    get:
      x-handler: handlers/users#listUsers
      x-inputParser: handlers/users#parseUsersListRequest
      summary: List requesters, for the validator dashboard's filter dropdown
      responses:
        '200':
          description: Success
        '401':
          description: Missing or invalid token
        '403':
          description: Authenticated but not a validator

  /vacation-requests/me:
    get:
      x-handler: handlers/vacationRequests#getMyRequests
      x-inputParser: handlers/vacationRequests#parseMyRequestsRequest
      summary: List the authenticated user's own vacation requests, paginated
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Success
        '401':
          description: Missing or invalid token

  /hello:
    get:
      x-handler: handlers/hello#getHello
      summary: Returns a welcome message
      responses:
        '200':
          description: Success

  /hello/:name:
    get:
      x-handler: handlers/hello#getHelloByName
      x-inputParser: handlers/hello#parseHelloByNameInput
      summary: Returns a personalized welcome message
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: Missing parameter
