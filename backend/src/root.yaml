openapi: 3.0.3
info:
  title: My API
  version: 1.0.0
paths:
  /auth/login:
    post:
      x-handler: handlers/auth#login
      x-inputParser: handlers/auth#parseLoginInput
      summary: Log in and receive a JWT
      responses:
        '200':
          description: Success
        '400':
          description: Missing email or password
        '401':
          description: Invalid email or password

  /vacation-requests:
    post:
      x-handler: handlers/vacationRequests#submitRequest
      x-inputParser: handlers/vacationRequests#parseSubmitRequest
      summary: Submit a vacation request (requester only)
      responses:
        '201':
          description: Created
        '400':
          description: Invalid input or date order/past-date rule violation
        '401':
          description: Missing or invalid token
        '403':
          description: Authenticated but not a requester
        '409':
          description: Overlaps an existing request

  /vacation-requests/me:
    get:
      x-handler: handlers/vacationRequests#getMyRequests
      x-inputParser: handlers/vacationRequests#parseMyRequestsRequest
      summary: List the authenticated user's own vacation requests, paginated
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Success
        '401':
          description: Missing or invalid token

  /hello:
    get:
      x-handler: handlers/hello#getHello
      summary: Returns a welcome message
      responses:
        '200':
          description: Success

  /hello/:name:
    get:
      x-handler: handlers/hello#getHelloByName
      x-inputParser: handlers/hello#parseHelloByNameInput
      summary: Returns a personalized welcome message
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: Missing parameter
